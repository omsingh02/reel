name: Feature request
description: Suggest an idea or improvement for Reel
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or frustration, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you've handled this, or similar features in other apps.
  - type: checkboxes
    id: scope
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and didn't find this request.
          required: true
