name: Bug report
description: Something in Reel isn't working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security problems, please use private vulnerability reporting instead (see the link on the issue chooser).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem. Screenshots or recordings help.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: account
    attributes:
      label: Signed in or guest?
      description: Guests store data in the browser; signed-in users sync through Supabase.
      options:
        - Signed in
        - Guest (not signed in)
        - Not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 130 on Arch Linux, Safari on iOS 18, ...
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console or network errors
      description: Open DevTools (F12), reproduce the problem, and paste anything red from the Console or Network tab.
      render: shell
